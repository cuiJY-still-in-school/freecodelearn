appId: com.freecodelearn.app
productName: FreeCodeLearn
copyright: Copyright © 2026 FreeCodeLearn

directories:
  output: release
  buildResources: electron

files:
  - electron/**
  - package.json
  - server/**

asarUnpack:
  - server/**

asar: true

linux:
  target:
    - AppImage
  category: Education
  icon: electron/icon.png
  maintainer: FreeCodeLearn

win:
  target:
    - nsis
  icon: electron/icon.png

mac:
  target:
    - dmg
  category: public.app-category.education
  icon: electron/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
