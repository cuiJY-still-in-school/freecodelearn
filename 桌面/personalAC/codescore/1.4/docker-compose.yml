version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personalac
    restart: unless-stopped
    ports:
      - "7575:7575"
    volumes:
      - pac-data:/data
    environment:
      PORT: 7575
      DATA_DIR: /data
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:7575
      ENCRYPT_SECRET: ${ENCRYPT_SECRET:-personalac-local-secret-change-me}
      RESEND_API_KEY: re_EFSNcwBj_C85rmsf7494gxGz4GY4VScR6

volumes:
  pac-data:
    driver: local
