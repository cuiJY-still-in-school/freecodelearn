[package]
name = "skyfly-core"
version = "0.1.0"
edition = "2021"
description = "SkyFly core engine - AI-powered automation tool"
authors = ["SkyFly Team"]
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
ctrlc = { version = "3.4", features = ["termination"] }
regex = "1.10"
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.4"

[dev-dependencies]
tokio-test = "0.4"