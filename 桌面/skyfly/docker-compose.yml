version: '3.8'

services:
  skyfly-core:
    build:
      context: ./rust-core
      dockerfile: Dockerfile
    container_name: skyfly-core
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=debug
      - AI_SERVICE_URL=http://skyfly-ai:8000
    networks:
      - skyfly-network
    restart: unless-stopped

  skyfly-ai:
    build:
      context: ./python-ai
      dockerfile: Dockerfile
    container_name: skyfly-ai
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gpt-4}
    networks:
      - skyfly-network
    restart: unless-stopped

networks:
  skyfly-network:
    driver: bridge